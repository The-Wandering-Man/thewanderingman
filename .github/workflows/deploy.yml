name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. Two overlapping runs could publish out of order and
# leave an older commit live.
concurrency:
  group: netlify-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out the commit
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # `netlify deploy --build` runs the Netlify build (netlify.toml plus the
      # Next.js runtime plugin), then publishes the result. The plugin is what
      # turns .next into static assets and the serverless functions behind the
      # dynamic routes, API routes and middleware - so a plain
      # `--dir=.next` deploy would publish raw build artefacts and break them.
      - name: Build and deploy to production
        run: npx --yes netlify-cli@latest deploy --build --prod --message "$GITHUB_SHA"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
